name: actions
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ☑️ Checkout code
        uses: actions/checkout@v2.8.0
        with:
          fetch-depth: 2

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          # 原稿の YAML を読むだけなので、Gemfile の gem は使わない
          # （この版の gem は今のランナーのコンパイラでビルドできない）
          ruby-version: '3.4'

      - name: ✅ Check YAML format
        run: ruby yasslab/test/yml_test.rb

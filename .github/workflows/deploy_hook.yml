name: Deploy Hook

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  event:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download codes from GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ✅️ Check if contents changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            contents:
              - 'guides/**'

      - name: 🚀 Deploy if contents changed
        if: steps.changes.outputs.contents == 'true'
        env:
          DEPLOY_HOOK_TOKEN:    ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_HOOK_ENDPOINT: ${{ secrets.DEPLOY_HOOK_ENDPOINT }}
        run: |
          # --fail-with-body が無いと、401 や 404 が返っても curl は exit 0 になる。
          # ジョブは緑のままデプロイだけが起きず、誰も気づかないので失敗させる。
          # 値は式に展開せず環境変数から読む（シェルの引用が効くようにする）。
          curl --fail-with-body -sS -X POST \
               -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
               "$DEPLOY_HOOK_ENDPOINT" \
               -d '{"ref":"master"}'
